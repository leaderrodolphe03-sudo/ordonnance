# Exemple Nginx en HTTPS devant l'application (Linux).
# Dans .env : HOST=127.0.0.1  TRUST_PROXY=1  COOKIE_SECURE=1
server {
    listen 80;
    server_name ordonnances.cabinet.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ordonnances.cabinet.local;

    ssl_certificate     /etc/ssl/certs/ordonnances.crt;
    ssl_certificate_key /etc/ssl/private/ordonnances.key;

    client_max_body_size 2m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
